<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav class="academic-nav" aria-label="Main navigation">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% if page.lang == 'zh-CN' %}
      <ul><li><a href="{{ '/zh/' | relative_url }}" aria-current="page">首页</a></li><li><a href="{{ '/publications/' | relative_url }}">论文（英文）</a></li><li><a href="{{ '/' | relative_url }}" lang="en" hreflang="en">English</a></li></ul>
      {% else %}
      <ul>{% for link in site.data.navigation.main %}<li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>{% endfor %}<li><a href="{{ "/zh/" | relative_url }}" lang="zh-CN" hreflang="zh-CN">中文</a></li></ul>
      {% endif %}
    </nav>
  </div>
</div>
